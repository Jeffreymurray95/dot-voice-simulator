name: Deploy verified v16 simulator to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v16'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@v6

      - name: Download and verify exact v16 release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p extracted
          gh release download v16 --pattern "github-pages-dot-voice-simulator.zip" --dir .
          echo "65b759587163ba80391d971d4ec6ac47277ee86e70f031784fefcfdf2a4849b1  github-pages-dot-voice-simulator.zip" | sha256sum --check --strict
          unzip -q github-pages-dot-voice-simulator.zip -d extracted
          test -f extracted/index.html
          test -f extracted/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: extracted

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
